name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript, sizing example and LiDAR scan maths
        run: |
          node --check dist/fit.js
          node --check dist/scan.js
          node --check dist/models.js
          node tests/scan.test.js
          node tests/models.test.js
          node tests/fit.test.js
          node -e "const {fitStocking}=require('./dist/fit.js'); const r=fitStocking({ankle:20,calf:43,length:36}); if (r.band!=='Small'||r.cut!=='Wide'||r.length!=='Short') { console.error(r); process.exit(1) }"
      - name: Version asset URLs so browsers load updates at once
        run: sed -i "s/__VERSION__/${GITHUB_SHA::8}/g" dist/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
