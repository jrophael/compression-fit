# XcodeGen spec for the Compression Fit iPhone app.
# Generate the Xcode project on a Mac:  brew install xcodegen && cd ios && xcodegen
name: CompressionFit
options:
  bundleIdPrefix: com.rophael
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
targets:
  CompressionFit:
    type: application
    platform: iOS
    sources:
      - path: Sources
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Compression Fit
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        NSCameraUsageDescription: "The cameras, LiDAR and Face ID depth sensor measure the leg for stocking sizing. Scans stay on this iPhone unless you export them or send them to Compression Fit to measure."
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiredDeviceCapabilities:
          - arkit
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rophael.compressionfit
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
        # Set DEVELOPMENT_TEAM to your Apple Developer team ID, or choose the team in Xcode.
